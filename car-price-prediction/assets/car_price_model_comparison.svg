<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Car price prediction: RMSE comparison of five regression models</title><rect width="1600" height="900" fill="#071529"/><rect x="76" y="56" width="56" height="8" fill="#4dd4c0"/><text x="76" y="128" fill="#f1f7ff" font-size="54" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >MODEL EVALUATION</text><text x="76" y="174" fill="#a2bbd1" font-size="23" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >Held-out test results  |  Lower RMSE means lower prediction error</text><rect x="76" y="223" width="1448" height="535" rx="16" fill="#10233d"/><text x="143" y="325" fill="#f1f7ff" font-size="28" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >Lasso</text><rect x="470" y="291" width="635.9359375" height="40" rx="4" fill="#567897"/><text x="1129.9359375" y="320" fill="#f1f7ff" font-size="26" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >2.63</text><text x="143" y="417" fill="#f1f7ff" font-size="28" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >Linear Regression</text><rect x="470" y="383" width="631.646796875" height="40" rx="4" fill="#567897"/><text x="1125.6467968749998" y="412" fill="#f1f7ff" font-size="26" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >2.61</text><text x="143" y="509" fill="#f1f7ff" font-size="28" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >Random Forest</text><rect x="470" y="475" width="503.28984375" height="40" rx="4" fill="#567897"/><text x="997.28984375" y="504" fill="#f1f7ff" font-size="26" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >2.08</text><text x="143" y="601" fill="#f1f7ff" font-size="28" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >Decision Tree</text><rect x="470" y="567" width="496.4165625" height="40" rx="4" fill="#567897"/><text x="990.4165625" y="596" fill="#f1f7ff" font-size="26" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >2.05</text><text x="143" y="693" fill="#f1f7ff" font-size="28" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >Extra Trees</text><rect x="470" y="659" width="387.88265624999997" height="40" rx="4" fill="#4dd4c0"/><text x="881.88265625" y="688" fill="#f1f7ff" font-size="26" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >1.60</text><text x="114" y="807" fill="#4dd4c0" font-size="24" font-weight="700" font-family='Arial,Segoe UI,sans-serif' >BEST PERFORMER: EXTRA TREES</text><text x="76" y="863" fill="#a2bbd1" font-size="19" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >301 source records  |  298 modelling rows  |  60 held-out test cases  |  Single split; not a production benchmark</text><text x="117" y="838" fill="#a2bbd1" font-size="18" font-weight="400" font-family='Arial,Segoe UI,sans-serif' >R² 0.918  |  RMSE 1.60  |  MAE 0.73; all reported in source dataset price units</text></svg>