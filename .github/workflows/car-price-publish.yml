name: Validate Used Vehicle Price Intelligence
on:
  push:
    branches: [car-price-reconstruction-release-20261026]
    paths:
      - 'car-price-prediction/**'
      - '.github/workflows/car-price-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: car-price-prediction/requirements.txt
      - name: Install dependencies
        working-directory: car-price-prediction
        run: python -m pip install -r requirements.txt
      - name: Generate reports and eight figures
        working-directory: car-price-prediction
        run: python run_analysis.py
      - name: Run regression and data-integrity tests
        working-directory: car-price-prediction
        run: python -m pytest -q
      - name: Verify dataset, notebook, results and graphics
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          r=Path('car-price-prediction')
          assert hashlib.sha256((r/'car_data.csv').read_bytes()).hexdigest()=='7f4f8dd90147fd735e4e5a02d174995b7d2d404837b6f11769f364b7c5f48024'
          n=json.loads((r/'car_price_prediction.ipynb').read_text())
          assert len(n['cells'])==29
          assert len([c for c in n['cells'] if c['cell_type']=='code'])==9
          assert not any(o.get('output_type')=='error' for c in n['cells'] for o in c.get('outputs',[]))
          p=list((r/'assets').glob('*.png'))
          assert len(p)==8
          assert all(f.stat().st_size>20000 for f in p)
          result=json.loads((r/'reports/metrics.json').read_text())
          assert result['audit']['source_rows']==301
          assert result['audit']['analytical_rows']==299
          assert result['champion']=='Random forest'
          print('Dataset, executed notebook, model results and all 8 graphics verified')
          PY
      - name: Commit generated figures and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A car-price-prediction/assets car-price-prediction/reports
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified car-price analysis figures'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
